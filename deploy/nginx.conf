# HTTPS front for the chat server. Replace chat.ttkprestige.com with the real
# name, then get a free certificate: sudo certbot --nginx -d chat.ttkprestige.com
server {
    server_name chat.ttkprestige.com;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Replies stream word by word; don't hold them back.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
